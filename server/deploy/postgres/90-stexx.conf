# /etc/postgresql/18/main/conf.d/90-stexx.conf  (Ubuntu 24.04, PGDG postgresql-18)
#
# Loaded after postgresql.conf. Every setting here is either a security control or a privacy control.

# ---- Network ----
# Loopback only. 5432 is never opened in ufw. (postgres.js cannot take a unix-socket path in a URL, so the app
# connects over 127.0.0.1 with scram; the backup role uses the unix socket with peer auth.)
listen_addresses = 'localhost'
password_encryption = scram-sha-256
# Hard ceiling; the app pool is 10 (DATABASE_POOL_MAX) and per-role limits are set in roles.sql.
max_connections = 50

# ---- Privacy: keep user content out of Postgres logs ----
# 'terse' drops the DETAIL and STATEMENT lines. Without it, a unique-violation logs
# "Key (email_hmac)=(...) already exists" and failing statements are echoed back into the log.
log_error_verbosity = terse
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = panic
log_connections = off
log_disconnections = off
log_hostname = off
log_lock_waits = on
log_line_prefix = '%m [%p] '
# Never enable these without a retention plan: they would keep deleted data around.
#   archive_mode / wal archiving (PITR), pg_stat_statements, auto_explain
archive_mode = off
