# Lines to INSERT near the top of /etc/postgresql/18/main/pg_hba.conf, above the stock
# "local all all peer" and "host all all 127.0.0.1/32 scram-sha-256" lines (first match wins).
# bootstrap.sh inserts this block between the markers below if it is not already there.
#
# TYPE   DATABASE  USER           ADDRESS         METHOD
# BEGIN stexx
local    stexx     stexx_app                      reject
local    stexx     stexx_owner                    reject
local    stexx     stexxbackup                    peer
host     stexx     stexx_app      127.0.0.1/32    scram-sha-256
host     stexx     stexx_app      ::1/128         scram-sha-256
host     stexx     stexx_owner    127.0.0.1/32    scram-sha-256
host     stexx     stexx_owner    ::1/128         scram-sha-256
host     stexx     all            all             reject
host     all       stexx_app      all             reject
host     all       stexx_owner    all             reject
# END stexx
