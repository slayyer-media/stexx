# /etc/systemd/system/caddy.service.d/stexx-admin.conf  (installed by deploy.sh --sync-config --with-admin)
#
# Gives Caddy the values Caddyfile.admin needs (STEXX_ADMIN_HOST and optionally STEXX_ADMIN_PORT; no secrets).
# A drop-in, so the stock caddy.service stays untouched.
[Service]
EnvironmentFile=/etc/stexx/caddy-admin.env
