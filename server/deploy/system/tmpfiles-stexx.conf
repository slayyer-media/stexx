# /etc/tmpfiles.d/stexx.conf
# Type Path Mode User Group Age
# Media: written by the API (stexx), read by Caddy through the stexx group. setgid so new files keep the group.
d /srv/stexx           0750 root   stexx -
d /srv/stexx/releases  0750 root   stexx -
d /srv/stexx/media     2750 stexx  stexx -
# NSFW model for the photo checks (scripts/fetch-photo-model.sh, run by deploy.sh). Root-owned, read-only to the API.
d /srv/stexx/models    0750 root   stexx -
# Backup state (StateDirectory of stexx-backup.service), owned by stexxbackup.
d /var/lib/stexx-backup    0755 stexxbackup stexxbackup -
# Full pre-migration snapshots (backup.sh --pre-migrate, run by deploy.sh as root). Root-only, and deliberately NOT
# inside /var/lib/stexx-backup: a directory stexxbackup can write to would let that user swap this one for a symlink
# that root then writes through. The watchdog deletes snapshots after STEXX_PREMIGRATE_TTL_HOURS (24); this age is
# the backstop if the watchdog is not running (systemd-tmpfiles-clean.timer runs daily).
d /var/lib/stexx-premigrate 0700 root        root        24h
