# /etc/systemd/journald.conf.d/stexx.conf
# Logs hold no user content (the API logs method, route pattern, status, duration only), but we keep them
# short anyway: 7 days, size-capped, and not duplicated into rsyslog files that rotate on a longer schedule.
[Journal]
Storage=persistent
MaxRetentionSec=7day
# journald only deletes whole archived files; without this the active file rotates monthly (default) and
# entries could live ~37 days. Rotate daily so MaxRetentionSec actually bounds retention to about 8 days.
MaxFileSec=1day
SystemMaxUse=500M
Compress=yes
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
RateLimitIntervalSec=30s
RateLimitBurst=2000
