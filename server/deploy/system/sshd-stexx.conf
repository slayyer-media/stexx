# /etc/ssh/sshd_config.d/00-stexx-hardening.conf
# sshd uses the FIRST value it sees for a keyword and reads sshd_config.d/*.conf in lexical order, so the
# 00- prefix makes this win over cloud-init's 50-cloud-init.conf (which may set PasswordAuthentication yes).
# Key-only authentication. Apply only after confirming key login works for a non-root sudo user.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 10:30:60
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
# local forwards (-L, e.g. a CI database tunnel) stay allowed; remote forwards (-R) do not.
AllowTcpForwarding local
PermitTunnel no
