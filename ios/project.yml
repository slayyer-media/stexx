# XcodeGen spec for the Stexx iOS app.
# Generate the Xcode project with:  xcodegen generate
name: Stexx

# Debug: mock backend. Local: debug build against a server on this Mac
# (`server/`, http://127.0.0.1:8787). Release: as shipped.
configs:
  Debug: debug
  Local: debug
  Release: release

options:
  bundleIdPrefix: gay.stexx
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Set your own team locally (Xcode > Signing & Capabilities); never commit it.
    DEVELOPMENT_TEAM: ""

# Signal Protocol (end-to-end encrypted chat): Signal's official libsignal,
# AGPL-3.0 like Stexx. The Swift bindings come from the tagged source; the Rust
# library is Signal's prebuilt XCFramework, pinned by SHA-256 in
# Packages/LibSignalFfi. Both must be the same version. See README.md.
packages:
  LibSignalClient:
    url: https://github.com/signalapp/libsignal
    exactVersion: 0.108.1
  LibSignalFfi:
    path: Packages/LibSignalFfi

targets:
  Stexx:
    type: application
    platform: iOS
    sources:
      - path: Stexx
    dependencies:
      - package: LibSignalClient
      - package: LibSignalFfi
    settings:
      base:
        PRODUCT_NAME: Stexx
        PRODUCT_BUNDLE_IDENTIFIER: gay.stexx.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        STEXX_API_BASE_URL: https://api.stexx.gay
        # ATS stays strict everywhere except the Local configuration (see
        # the "Allow local HTTP" build phase).
        STEXX_ATS_ALLOWS_LOCAL_NETWORKING: "NO"
        # Device attestation (docs/security.md). attest = App Attest with a
        # DeviceCheck fallback; dev-bypass = the header only a dev server
        # (ATTESTATION_MODE=dev) accepts, for the simulator and Local builds.
        STEXX_ATTESTATION_MODE: attest
        # App Attest environment in the entitlement: development keys for
        # Xcode builds, production for TestFlight / App Store.
        STEXX_APP_ATTEST_ENVIRONMENT: development
        # Passkey relying party (server WEBAUTHN_RP_ID). Becomes the
        # `webcredentials:` associated domain and `StexxPasskeyRelyingParty`;
        # stexx.gay must serve an apple-app-site-association listing the app
        # (server/deploy/README.md). See ios/README.md#passkeys.
        STEXX_PASSKEY_RP_ID: stexx.gay
        # Host of the server's APP_LINK_BASE: email sign-in links
        # (https://<host>/auth/email?token=…) open the app as universal links
        # through the `applinks:` associated domain (Stexx.entitlements only).
        STEXX_APP_LINK_HOST: stexx.gay
        # Committed (not generated) so the Local configuration can use its
        # own file: XcodeGen's `entitlements:` applies one file to every
        # configuration. App Attest + the webcredentials and applinks
        # associated domains.
        CODE_SIGN_ENTITLEMENTS: Stexx/Entitlements/Stexx.entitlements
      configs:
        Debug:
          STEXX_USE_MOCK_API: "YES"
        Local:
          STEXX_USE_MOCK_API: "NO"
          STEXX_ATTESTATION_MODE: dev-bypass
          STEXX_API_BASE_URL: http://127.0.0.1:8787
          # Plain HTTP to 127.0.0.1 / localhost only (NSAllowsLocalNetworking).
          STEXX_ATS_ALLOWS_LOCAL_NETWORKING: "YES"
          # No passkeys against a local server (iOS needs a real domain with
          # an apple-app-site-association file): no relying party, and an
          # entitlements file without the associated domain. The passkey
          # buttons explain this; email sign-in works.
          STEXX_PASSKEY_RP_ID: ""
          CODE_SIGN_ENTITLEMENTS: Stexx/Entitlements/StexxLocal.entitlements
          # The ATS build phase edits the processed Info.plist in place.
          ENABLE_USER_SCRIPT_SANDBOXING: NO
        Release:
          # Flip to NO once the backend is live.
          STEXX_USE_MOCK_API: "YES"
          STEXX_APP_ATTEST_ENVIRONMENT: production
    info:
      path: Stexx/Info.plist
      properties:
        CFBundleDisplayName: stexx
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: >-
          Stexx uses your approximate location to show people nearby.
          Your coordinates are rounded on your device before they are sent,
          and your exact location is never stored.
        StexxAPIBaseURL: $(STEXX_API_BASE_URL)
        StexxUseMockAPI: $(STEXX_USE_MOCK_API)
        StexxAttestationMode: $(STEXX_ATTESTATION_MODE)
        StexxPasskeyRelyingParty: $(STEXX_PASSKEY_RP_ID)
    postBuildScripts:
      # Adds NSAppTransportSecurity/NSAllowsLocalNetworking = true (a real
      # boolean) to the built Info.plist in the Local configuration only.
      # Debug and Release builds carry no ATS exception at all.
      - name: Allow local HTTP (Local only)
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          [ "${STEXX_ATS_ALLOWS_LOCAL_NETWORKING}" = "YES" ] || exit 0
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" \
            -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
    scheme:
      testTargets:
        - StexxTests
      gatherCoverageData: true

  StexxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StexxTests
      # The same StoreKit configuration the "Stexx Local" scheme uses.
      - path: StoreKit/Stexx.storekit
        buildPhase: resources
    dependencies:
      - target: Stexx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gay.stexx.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Runs against a local `server/` (see ../server and STOREKIT-LOCAL.md).
  # Purchases use the StoreKit configuration file, so no App Store Connect
  # setup is needed in the simulator.
  Stexx Local:
    build:
      targets:
        Stexx: all
        StexxTests: [test]
    run:
      config: Local
      storeKitConfiguration: StoreKit/Stexx.storekit
    test:
      config: Local
      gatherCoverageData: true
      targets:
        - StexxTests
    profile:
      config: Local
    analyze:
      config: Local
    archive:
      config: Release

fileGroups:
  - StoreKit
  - STOREKIT-LOCAL.md
